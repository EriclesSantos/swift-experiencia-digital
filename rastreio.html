<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rastreio do Pedido — Swift</title>
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .track-wrap{max-width:900px;margin:1rem auto;padding:0 1rem}
    .progress{height:10px;background:#eee;border-radius:999px;overflow:hidden}
    .progress > div{height:100%;width:10%;background:var(--swift);transition:width .4s}
    .track-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
    @media(max-width:900px){.track-grid{grid-template-columns:1fr}}
    .card{background:#fff;border:1px solid #eee;border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  </style>
</head>
<body>
  <div data-include="partials/header.html"></div>

  <main class="section">
    <h2 id="trackTitle">Pedido</h2>
    <div class="muted">
      Status: <b id="trackStatus">—</b> · Chegada estimada em <b id="trackEta">--:--</b>
    </div>
  
    <div class="progress" style="margin:8px 0 14px; background:#eee; border-radius:999px; height:8px; overflow:hidden">
      <div id="trackBar" style="height:100%; width:10%; background:#e64a19; transition:width .4s"></div>
    </div>
  
    <div id="map" style="height:420px; border:1px solid #e6e8ea; border-radius:14px; overflow:hidden; background:#f5f6f8"></div>
  
    <p id="trackCupom" class="muted" style="margin-top:10px"></p>
  
    <div style="text-align:center; margin-top:14px">
      <a class="btn" href="./minhaconta.html">Ver meus pedidos</a>
    </div>
  </main>
  
  <div data-include="partials/footer.html"></div>
  <script src="./script/script.js"></script>
</body>
</html>
